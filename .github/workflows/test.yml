name: Smoke tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test example render
        run: python rewind.py render --data examples/odyssey-2026.json --name "Sample Server" --theme forest --cta none --out output/smoke
      - name: Verify outputs
        run: test "$(find output/smoke -name 'slide-*.png' | wc -l)" -eq 5
